[package]
name = "nimi"
version = "0.1.0"
description = "NIMI — a small desktop companion that lives at the top of your Windows screen"
authors = ["kai"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "nimi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
