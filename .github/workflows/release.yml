# Release: push a tag like v1.0.0 → a GitHub Release with the NSIS installer and the portable exe.
# The app version comes from src-tauri/tauri.conf.json (and package.json); keep them equal to the tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run rust:clippy

      - name: Build (NSIS installer + exe)
        run: npm run tauri build

      - name: Collect artifacts
        id: files
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist-release/
          Copy-Item src-tauri/target/release/nimi.exe "dist-release/NIMI_${version}_portable.exe"
          Get-ChildItem dist-release | ForEach-Object { $_.Name }
          "version=$version" >> $env:GITHUB_OUTPUT

      # Code signing through SignPath (docs/SIGNING.md). Skipped until the project is approved and
      # the repository has the SIGNPATH_* variables and the SIGNPATH_API_TOKEN secret. SignPath
      # waits for each release to be approved by hand there, then the signed files replace these.
      - name: Upload the unsigned files for signing
        id: unsigned
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: nimi-unsigned
          path: dist-release/*.exe

      - name: Sign with SignPath
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signed

      - name: Use the signed files
        if: steps.unsigned.outcome == 'success'
        shell: pwsh
        run: |
          Copy-Item dist-signed/*.exe dist-release/ -Force
          Get-ChildItem dist-release/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "{0}: {1}" -f $_.Name, $sig.Status
            if ($sig.Status -ne 'Valid') { throw "$($_.Name) is not signed" }
          }

      # The notes are this version's section of CHANGELOG.md (from its "## x.y.z" heading to the
      # next one). A tag without a section fails here, so every release gets written notes.
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ steps.files.outputs.version }}"
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## $([regex]::Escape($version))(\s|$)") { $start = $i + 1; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md has no '## $version' section" }
          $end = $lines.Count
          for ($i = $start; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^## ') { $end = $i; break } }
          $body = ($lines[$start..($end - 1)] -join "`n").Trim()
          $footer = "**Download:** ``NIMI_${version}_x64-setup.exe`` installs for your account (no admin); ``NIMI_${version}_portable.exe`` runs without installing. Windows 10 and 11."
          Set-Content notes.md -Encoding utf8 -Value "$body`n`n---`n$footer"
          Get-Content notes.md

      # Self-update (docs/SIGNING.md): sign the final installer with the updater key and describe it
      # in latest.json, which installed copies read when the user presses «حدّث الحين». Runs after
      # SignPath, so the signature covers the file as published. Without the key secret the release
      # goes out without these two files (and «حدّث الحين» falls back to the download page).
      - name: Updater signature and latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { "No TAURI_SIGNING_PRIVATE_KEY secret: no self-update files."; exit 0 }
          $version = "${{ steps.files.outputs.version }}"
          $setup = "dist-release/NIMI_${version}_x64-setup.exe"
          npx tauri signer sign $setup
          if (-not (Test-Path "$setup.sig")) { throw "the updater signature was not written" }
          $latest = [ordered]@{
            version   = $version
            notes     = (Get-Content notes.md -Raw -Encoding utf8)
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content "$setup.sig" -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/NIMI_${version}_x64-setup.exe"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content dist-release/latest.json -Encoding utf8NoBOM
          Get-Content dist-release/latest.json

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist-release -File).FullName `
            --title "NIMI ${{ steps.files.outputs.version }}" `
            --notes-file notes.md

      - name: Keep the build (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: nimi-windows
          path: dist-release/*.exe
