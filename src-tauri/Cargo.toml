[package]
name = "nimi"
version = "0.1.0"
description = "NIMI — a small desktop companion that lives at the top of your Windows screen"
authors = ["kai"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "nimi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
tauri-plugin-autostart = "2"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Registry", "Foundation", "Media_Control", "Storage_Streams", "Win32_System_WinRT", "Win32_System_Com", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Graphics_Dwm", "Win32_System_Threading"] }
tauri-plugin-log = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
