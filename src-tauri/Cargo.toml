[package]
name = "nimi"
version = "1.0.1"
description = "NIMI — a small desktop companion that lives at the top of your Windows screen"
authors = ["kai"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "nimi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
tauri-plugin-autostart = "2"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Control",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Networking_NetworkListManager",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_System_Shutdown",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Web_Http",
] }
tauri-plugin-log = "2"
lopdf = "0.42"
pdf-extract = "0.12.1"
webp = "0.3.1"
image = { version = "0.25.6", default-features = false, features = ["ico", "png", "webp"] }
url = "2.5.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
